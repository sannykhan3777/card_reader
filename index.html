<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cards">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Card Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f4ef;--surface:#fff;--text:#1d1d1b;--muted:#6b6a65;--line:#e2dfd6;--accent:#0f6b4f;--on-accent:#fff;--danger:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--surface:#1f1f1d;--text:#f0eee8;--muted:#9c9a92;--line:#33322e;--accent:#4cc596;--on-accent:#0b1f17;--danger:#f2b8b5;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 16px;border-radius:10px;font-size:1rem;cursor:pointer;display:inline-block}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#preview{display:none;max-width:100%;max-height:240px;border-radius:10px;border:1px solid var(--line);margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=email],input[type=tel]{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
#status{margin-top:10px;font-size:.9rem;color:var(--muted);min-height:1.2em}
#status.err{color:var(--danger)}
progress{width:100%;height:6px;margin-top:8px;display:none}
details{margin-top:10px;font-size:.85rem;color:var(--muted)}
pre{white-space:pre-wrap;direction:auto;margin:6px 0 0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600}
td button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:1rem}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Card Scanner</h1>
  <p class="sub">Arabic and English business cards to Excel. Free, and the photo stays on your phone.</p>

  <section class="card">
    <div class="row">
      <label class="btn primary" for="file" style="margin:0;color:var(--on-accent)">Take or choose photo</label>
      <input id="file" type="file" accept="image/*" capture="environment" hidden>
      <button class="btn" id="scan" disabled>Read card</button>
    </div>
    <img id="preview" alt="Business card preview">
    <progress id="prog" max="1" value="0"></progress>
    <div id="status"></div>
    <details id="rawbox"><summary>Show raw text</summary><pre id="raw"></pre></details>

    <div class="grid">
      <div><label for="f_name">Name</label><input type="text" id="f_name" dir="auto"></div>
      <div><label for="f_name_ar">Name (Arabic)</label><input type="text" id="f_name_ar" dir="auto"></div>
      <div><label for="f_title">Job title</label><input type="text" id="f_title" dir="auto"></div>
      <div><label for="f_company">Company</label><input type="text" id="f_company" dir="auto"></div>
      <div><label for="f_company_ar">Company (Arabic)</label><input type="text" id="f_company_ar" dir="auto"></div>
      <div><label for="f_email">Email</label><input type="email" id="f_email"></div>
      <div><label for="f_phone">Phone</label><input type="tel" id="f_phone" dir="ltr"></div>
      <div><label for="f_website">Website</label><input type="text" id="f_website" dir="ltr"></div>
      <div class="full"><label for="f_address">Address</label><input type="text" id="f_address" dir="auto"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="add">Add to list</button>
      <button class="btn" id="clearform">Clear</button>
    </div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <strong id="count">Saved cards (0)</strong>
      <button class="btn primary" id="export" disabled>Download Excel</button>
    </div>
    <div class="tablewrap" id="tablewrap"></div>
  </section>
</main>

<script>
const FIELDS=["name","name_ar","title","company","company_ar","email","phone","website","address"];
const LABELS={name:"Name",name_ar:"Name (Arabic)",title:"Job title",company:"Company",company_ar:"Company (Arabic)",email:"Email",phone:"Phone",website:"Website",address:"Address"};
const $=id=>document.getElementById(id);
let rows=[],imgBlob=null,worker=null;
try{rows=JSON.parse(localStorage.getItem("cards")||"[]")||[];}catch(e){rows=[];}
const persist=()=>{try{localStorage.setItem("cards",JSON.stringify(rows));}catch(e){}};
function status(t,err){const s=$("status");s.textContent=t||"";s.className=err?"err":"";}

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* ---------- image prep: scale + grayscale + contrast ---------- */
function prep(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(2,2200/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      const x=c.getContext("2d");x.filter="grayscale(1) contrast(1.35)";x.drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(),"image/png");URL.revokeObjectURL(url);
    };
    img.onerror=rej;img.src=url;
  });
}
$("file").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{imgBlob=await prep(f);const p=$("preview");p.src=URL.createObjectURL(imgBlob);p.style.display="block";$("scan").disabled=false;status("Photo ready. Tap “Read card”.");}
  catch(err){status("Couldn’t load that image.",true);}
});

/* ---------- OCR ---------- */
async function getWorker(){
  if(worker)return worker;
  worker=await Tesseract.createWorker(["ara","eng"],1,{logger:m=>{
    const p=$("prog");p.style.display="block";
    if(m.progress!=null)p.value=m.progress;
    if(m.status)status(m.status.replace(/_/g," ")+"…");
  }});
  return worker;
}
$("scan").addEventListener("click",async()=>{
  if(!imgBlob)return;
  $("scan").disabled=true;status("Starting… (first scan downloads language data)");
  try{
    const w=await getWorker();
    const {data}=await w.recognize(imgBlob);
    $("raw").textContent=data.text;
    fill(parse(data.text));
    status("Done. Check each field, fix anything, then add to list.");
  }catch(e){status("Couldn’t read the card. Check your internet connection for the first scan, or try a clearer photo.",true);}
  finally{$("prog").style.display="none";$("scan").disabled=false;}
});

/* ---------- parsing ---------- */
const AR=/[\u0600-\u06FF]/, LAT=/[A-Za-z]/;
const toWest=s=>s.replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-0x660).replace(/[\u06F0-\u06F9]/g,d=>d.charCodeAt(0)-0x6F0);
const TITLE=/\b(manager|director|engineer|ceo|cfo|cto|coo|president|vice|chairman|founder|partner|consultant|specialist|executive|officer|head|supervisor|sales|marketing|accountant|lead|senior|assistant|advisor|architect|doctor|dr\.?)\b|مدير|مهندس|رئيس|نائب|مستشار|محاسب|مسؤول|مشرف|أخصائي|اخصائي|مؤسس|شريك|دكتور|طبيب|مبيعات|تسويق/i;
const COMPANY=/\b(ltd|llc|inc|corp|co\.?|company|group|trading|holding|est\.?|establishment|industries|international|contracting|services|solutions|technologies|bank|university|hospital)\b|شركة|مؤسسة|مجموعة|للتجارة|للمقاولات|مصنع|بنك|جامعة|مستشفى|القابضة|للخدمات/i;
const ADDR=/\b(street|st\.|road|rd\.|avenue|ave|p\.?o\.?\s?box|building|bldg|floor|tower|district|riyadh|jeddah|dammam|khobar|makkah|madinah|saudi|ksa|kingdom)\b|شارع|طريق|ص\.?\s?ب|حي|الرياض|جدة|الدمام|الخبر|مكة|المدينة|برج|مبنى|المملكة|السعودية/i;

function parse(raw){
  const out={};FIELDS.forEach(k=>out[k]="");
  let lines=raw.split(/\r?\n/).map(l=>l.replace(/[|_•·▪■◆►]/g," ").replace(/\s+/g," ").trim()).filter(l=>l.length>1);

  const rest=[],phones=[];
  for(const l of lines){
    const t=toWest(l);
    const em=t.match(/[A-Za-z0-9._%+-]+\s?@\s?[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);
    if(em&&!out.email){out.email=em[0].replace(/\s/g,"").toLowerCase();continue;}
    const web=t.match(/\b((https?:\/\/)?(www\.)[A-Za-z0-9.-]+\.[A-Za-z]{2,}[^\s]*|[A-Za-z0-9-]+\.(com|net|org|sa|co|io|ae|edu)(\.[a-z]{2})?\b[^\s@]*)/i);
    if(web&&!out.website&&!/@/.test(t)){out.website=web[0].toLowerCase();continue;}
    const digits=t.replace(/\D/g,"");
    if(digits.length>=7&&digits.length<=15&&(t.match(/[\d+()\-\s.]/g)||[]).length>=t.length*0.6){
      phones.push(t.replace(/^(tel|mob|mobile|phone|cell|fax|t|m|f|ت|جوال|هاتف|فاكس)[\s:.-]*/i,"").trim());continue;
    }
    rest.push(l);
  }
  out.phone=phones.join(" / ");

  const used=new Set();
  const take=(re,lang)=>{const i=rest.findIndex((l,j)=>!used.has(j)&&re.test(l)&&(lang==="ar"?AR.test(l):lang==="en"?LAT.test(l)&&!AR.test(l):true));if(i>=0){used.add(i);return rest[i];}return "";};

  out.title=take(TITLE,"en")||take(TITLE,"ar");
  out.company=take(COMPANY,"en");
  out.company_ar=take(COMPANY,"ar");
  const addr=[];
  rest.forEach((l,j)=>{if(!used.has(j)&&ADDR.test(l)){used.add(j);addr.push(l);}});
  out.address=addr.join(", ");

  const left=rest.filter((l,j)=>!used.has(j)&&l.replace(/[^A-Za-z\u0600-\u06FF]/g,"").length>=3);
  out.name=left.find(l=>LAT.test(l)&&!AR.test(l))||"";
  out.name_ar=left.find(l=>AR.test(l))||"";
  if(!out.company){const c=left.find(l=>LAT.test(l)&&!AR.test(l)&&l!==out.name);if(c)out.company=c;}
  if(!out.company_ar){const c=left.find(l=>AR.test(l)&&l!==out.name_ar);if(c)out.company_ar=c;}
  return out;
}
function fill(o){FIELDS.forEach(k=>{$("f_"+k).value=o[k]||"";});}

/* ---------- list + export ---------- */
function readForm(){const o={};FIELDS.forEach(k=>o[k]=$("f_"+k).value.trim());return o;}
function clearForm(){FIELDS.forEach(k=>$("f_"+k).value="");$("preview").style.display="none";$("file").value="";imgBlob=null;$("scan").disabled=true;$("raw").textContent="";status("");}
$("clearform").onclick=clearForm;
$("add").onclick=()=>{
  const o=readForm();
  if(!FIELDS.some(k=>o[k])){status("Nothing to add yet.",true);return;}
  rows.push(o);persist();render();clearForm();status("Added.");
};
function render(){
  $("count").textContent="Saved cards ("+rows.length+")";$("export").disabled=!rows.length;
  const w=$("tablewrap");w.textContent="";
  if(!rows.length){const d=document.createElement("div");d.className="empty";d.textContent="No cards yet.";w.appendChild(d);return;}
  const t=document.createElement("table"),h=t.createTHead().insertRow();
  FIELDS.forEach(k=>{const th=document.createElement("th");th.textContent=LABELS[k];h.appendChild(th);});
  h.appendChild(document.createElement("th"));
  const tb=t.createTBody();
  rows.forEach((r,i)=>{
    const tr=tb.insertRow();
    FIELDS.forEach(k=>{const c=tr.insertCell();c.textContent=r[k]||"";c.dir="auto";});
    const b=document.createElement("button");b.textContent="✕";b.setAttribute("aria-label","Remove card");
    b.onclick=()=>{rows.splice(i,1);persist();render();};
    tr.insertCell().appendChild(b);
  });
  w.appendChild(t);
}
$("export").onclick=async()=>{
  const aoa=[FIELDS.map(k=>LABELS[k])].concat(rows.map(r=>FIELDS.map(k=>r[k]||"")));
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=FIELDS.map(()=>({wch:24}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Contacts");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const file=new File([buf],"business-cards.xlsx",{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Business cards"});return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};
render();
</script>
</body>
</html>
